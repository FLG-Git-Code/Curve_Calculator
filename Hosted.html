html,body{margin:0;height:100%}

.c9-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:5px;font-size:12.5px}
.c9-meta label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.c9-meta input[type=checkbox]{width:17px;height:17px;margin:0}
.c9-src{font-size:11px;font-weight:800;letter-spacing:.02em;border-radius:999px;padding:2px 8px;white-space:nowrap}
.c9-src.auto{background:var(--orgbg);color:var(--orgfg)}
.c9-src.auto.ok{background:var(--grnbg);color:var(--grnfg)}
.c9-src.user{background:var(--pill);color:var(--fg)}
.c9-src.lock{background:#e8e2f8;color:#4a2a8a}
.c9-revert{border:0;background:transparent;color:var(--blue);font-weight:700;padding:2px 0;cursor:pointer;font-size:12.5px;text-decoration:underline}
.c9-grid .field.c9-locked .flabel:after{content:" 🔒";font-size:12px}

.c9-efp input{width:18px;height:18px;margin-top:2px}

.c9-noprv input{width:17px;height:17px;margin:0}
.c9-noprv.on{border-color:var(--flag);background:var(--orgbg);color:var(--orgfg)}

.c9-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 4px}
.c9-summary .kpi{margin:0}
.c9-how{font-size:13px;margin:4px 0 10px;color:var(--mut)}
.curve-table tr.c9-selrow td{outline:2px solid var(--blue);outline-offset:-2px}
.curve-table tr.c9-dim td{opacity:.55}

.c9-meta input[type=checkbox]{width:20px;height:20px}}

  const src=m.lock?`<span class="c9-src lock">Locked</span>`:auto?(blank?'':`<span class="c9-src auto${m.conf?' ok':''}">${m.conf?'Auto · confirmed':'Auto-filled'}</span>`):`<span class="c9-src user">Entered</span>`;
  const conf=auto&&!blank&&!m.lock?`<label title="Accept this automatic value"><input type="checkbox" data-c9conf="${k}" ${m.conf?'checked':''}> Confirm</label>`:'';
  const revert=!auto&&!m.lock?`<button type="button" class="c9-revert" data-c9revert="${k}" title="Let the calculator fill this value again">↺ Use auto</button>`:'';
  const lock=`<label title="${blank&&!m.lock?'Enter or calculate a value before locking it':'Keep this value fixed — it will not be auto-replaced by other inputs'}"><input type="checkbox" data-c9lock="${k}" ${m.lock?'checked':''} ${blank&&!m.lock?'disabled':''}> Lock</label>`;
  return `<div class="c9-meta noprint">${src}${conf}${revert}${lock}</div>`;
}

/* ---------- render ---------- */
/* In-place update: the existing elements are kept and only what changed is patched, so the field being
   typed in, the caret, an open dropdown, the on-screen keyboard and the element a tap/Tab is moving to are
   never replaced. Values of the focused control and the open/closed state of <details> are left alone. */
function morphAttrs(a,b){
  for(const at of [...a.attributes]){if(!b.hasAttribute(at.name)&&!(a.tagName==='DETAILS'&&at.name==='open'))a.removeAttribute(at.name);}
  for(const at of [...b.attributes]){if(a.tagName==='DETAILS'&&at.name==='open')continue;if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName||(a.nodeType===1&&(a.getAttribute('data-c9f')||'')!==(b.getAttribute('data-c9f')||''))){a.replaceWith(b);return;}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  if(a.nodeType!==1)return;
  morphAttrs(a,b);
  const focused=a===document.activeElement;
  if(a.tagName==='INPUT'){if(a.type==='checkbox'||a.type==='radio'){const c=b.hasAttribute('checked');if(a.checked!==c)a.checked=c;}else if(!focused){const v=b.getAttribute('value')||'';if(a.value!==v)a.value=v;}return;}
  if(a.tagName==='TEXTAREA'){if(!focused&&a.value!==b.value)a.value=b.value;return;}
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){if(i<ac.length)morph(ac[i],bc[i]);else a.appendChild(bc[i]);}
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
  if(a.tagName==='SELECT'){const o=[...b.options].find(x=>x.hasAttribute('selected'))||b.options[0];if(o&&a.value!==o.value)a.value=o.value;}
}

/* ---------- undo / redo ---------- */
const HIST={past:[],future:[],present:null,t:null,edit:null,max:100};
/* snapshots are taken of the fully solved state, so a later re-draw never creates a phantom undo step */
function snap(){try{c9Run(P.curve);}catch(e){}return JSON.stringify(P);}
function histPending(){return !!HIST.t||!!(HIST.edit&&HIST.edit.dirty);}
function updUndoBtns(){document.querySelectorAll('[data-act="undo"]').forEach(u=>u.disabled=!HIST.past.length&&!histPending());document.querySelectorAll('[data-act="redo"]').forEach(r=>r.disabled=!HIST.future.length);}
function histCommit(){clearTimeout(HIST.t);HIST.t=null;const sn=snap();if(sn!==HIST.present){if(HIST.present!=null){HIST.past.push(HIST.present);if(HIST.past.length>HIST.max)HIST.past.shift();}HIST.present=sn;HIST.future=[];}updUndoBtns();}
function histSoon(){if(HIST.present==null)return;if(HIST.edit){HIST.edit.dirty=snap()!==HIST.edit.before;updUndoBtns();return;}clearTimeout(HIST.t);HIST.t=setTimeout(histCommit,450);updUndoBtns();}
function historyEditControl(t){if(!t||t.disabled||t.readOnly)return false;if(t.tagName==='TEXTAREA')return true;if(t.tagName!=='INPUT')return false;return !['checkbox','radio','range','file','button','submit','reset','color'].includes((t.type||'text').toLowerCase())&&t.id!=='codejump';}
function beginHistoryEdit(t){if(!historyEditControl(t)||HIST.present==null)return;if(HIST.edit&&HIST.edit.el===t)return;if(HIST.edit)endHistoryEdit(HIST.edit.el);if(HIST.t)histCommit();HIST.edit={el:t,before:HIST.present,dirty:false};}
function endHistoryEdit(t){if(!HIST.edit||t&&HIST.edit.el!==t)return;const ed=HIST.edit;HIST.edit=null;if(ed.dirty||snap()!==ed.before)histCommit();else updUndoBtns();}
document.addEventListener('focusin',e=>beginHistoryEdit(e.target));
document.addEventListener('focusout',e=>endHistoryEdit(e.target));
function histReset(){clearTimeout(HIST.t);HIST.t=null;HIST.edit=null;HIST.past=[];HIST.future=[];HIST.present=snap();updUndoBtns();}
function histRestore(){HIST.edit=null;P=JSON.parse(HIST.present);clearTimeout(saveT);saveT=setTimeout(()=>DB.set('autosave',{t:Date.now(),p:JSON.parse(JSON.stringify(P))}),400);render(true);updUndoBtns();}
function undo(){if(HIST.edit&&snap()!==HIST.edit.before)HIST.edit.dirty=true;const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();if(HIST.t)histCommit();if(!HIST.past.length){toast('Nothing to undo.');return;}HIST.future.push(HIST.present);HIST.present=HIST.past.pop();histRestore();toast('↶ Undone');}
function redo(){const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();if(HIST.t)histCommit();if(!HIST.future.length){toast('Nothing to redo.');return;}HIST.past.push(HIST.present);HIST.present=HIST.future.pop();histRestore();toast('↷ Redone');}

function codeSafeText(src){return String(src||'').replace(/(APP_PASSWORD\s*=\s*)['"][^'"]*['"]/g,"$1'••••'").replace(/(enter app password[^\n]*)/gi,'enter protected credential');}
function codeFocus(name,meta){const n=document.getElementById('codefocusname'),m=document.getElementById('codefocusmeta');if(n)n.textContent=name;if(m)m.textContent=meta;}
function paintCodeViewer(animate){const pre=document.getElementById('codepre'),modal=document.getElementById('codem'),btn=document.querySelector('#codem [data-act="codeanim"]');if(!pre||!modal)return;clearInterval(CODE_TIMER);CODE_TIMER=null;modal.classList.toggle('noanim',!animate);if(!animate){pre.textContent=CODE_FULL;if(btn)btn.textContent='▶ Animate code';return;}pre.textContent='';let i=0;if(btn)btn.textContent='■ Stop animation';CODE_TIMER=setInterval(()=>{i=Math.min(CODE_FULL.length,i+18);pre.textContent=CODE_FULL.slice(0,i);if(i>=CODE_FULL.length){clearInterval(CODE_TIMER);CODE_TIMER=null;}},10);}
function showCodeMap(){CODE_INDEX=-1;CODE_FULL=codeViewerText(CODE_ROWS);document.querySelectorAll('#codem .code-item').forEach(x=>x.classList.remove('on'));codeFocus('PROGRAM MAP',`${CODE_ROWS.length} live functions · select one to inspect its source`);paintCodeViewer(false);const w=document.getElementById('codewrap');if(w)w.scrollTop=0;}
function showCodeTour(i){if(!(i>=0&&i<CODE_ROWS.length))return;CODE_INDEX=i;const row=CODE_ROWS[i],src=codeSafeText(Function.prototype.toString.call(row[1]));CODE_FULL=`// TOUR ${i+1}/${CODE_ROWS.length} · ${row[0]} · ${row[3].toUpperCase()}\n// ${row[2]}\n// Read-only live source (${src.split('\n').length} lines, ${src.length} characters).\n\n${src}`;document.querySelectorAll('#codem .code-item').forEach((x,k)=>x.classList.toggle('on',k===i));codeFocus(`${row[1].name}()`,`${row[0]} · ${row[3]} · ${src.split('\n').length} lines · ${src.length} chars`);const input=document.getElementById('codejump');if(input)input.value=row[1].name+'()';const status=document.getElementById('codestatus');if(status)status.textContent=`Tour ${i+1} of ${CODE_ROWS.length}: ${row[2]}`;paintCodeViewer(false);const w=document.getElementById('codewrap');if(w)w.scrollTop=0;const item=document.querySelector(`#codem .code-item[data-i="${i}"]`);if(item&&item.scrollIntoView)item.scrollIntoView({block:'nearest'});}
function codeNav(d){showCodeTour(CODE_INDEX<0?(d>0?0:CODE_ROWS.length-1):(CODE_INDEX+d+CODE_ROWS.length)%CODE_ROWS.length);}
function jumpCodeViewer(raw){const q=String(raw||'').trim().replace(/\(\s*\)$/,'').toLowerCase(),status=document.getElementById('codestatus');if(!q){showCodeMap();if(status)status.textContent='Program map opened.';return;}let i=CODE_ROWS.findIndex(r=>r[1].name.toLowerCase()===q||r[0].toLowerCase()===q);if(i<0)i=CODE_ROWS.findIndex(r=>r[1].name.toLowerCase().startsWith(q)||r[0].toLowerCase().startsWith(q));if(i<0){if(status)status.textContent=`No tour function named “${raw}”. Choose an item below.`;return;}showCodeTour(i);}
function openCodeViewer(){
  CODE_ROWS=codeTourRows();CODE_INDEX=-1;CODE_FULL=codeViewerText(CODE_ROWS);let m=document.getElementById('codem');
  if(!m){m=document.createElement('div');m.id='codem';m.className='code-modal';document.body.appendChild(m);}
  const options=CODE_ROWS.map(r=>`<option value="${esc(r[1].name)}()">${esc(r[0])}</option>`).join('');
  m.innerHTML=`<div class="code-head"><div><b>${APP_NAME} v${APP_RELEASE} — Engineer Code Console</b><small>Read-only live source tour; no duplicate application source is embedded.</small><div class="code-command"><label for="codejump">⌘</label><input id="codejump" list="codefunctions" autocomplete="off" spellcheck="false" placeholder="Type c9Run() and press Enter"><datalist id="codefunctions">${options}</datalist><button class="code-btn" data-act="codemap">Program map</button></div><div class="code-status" id="codestatus">Enter a function name, or select a guided-tour item.</div></div><div class="btns"><button class="code-btn" data-act="codeanim">■ Stop animation</button><button class="code-btn" data-act="codeclose">✕ Close</button></div></div><div class="code-grid"><section class="code-tour"><h2>Guided Tour — ${CODE_ROWS.length} main functions</h2>${CODE_ROWS.map((r,i)=>`<button type="button" class="code-item" data-act="codetour" data-i="${i}"><b>${i+1}. ${esc(r[0])}</b><span>${esc(r[2])}</span><code>${esc(r[1].name)}()</code><em>${esc(r[3])}</em></button>`).join('')}</section><section class="code-screen"><div class="code-scan"></div><div class="code-focus"><b id="codefocusname">PROGRAM MAP</b><span id="codefocusmeta">${CODE_ROWS.length} live functions</span><div class="btns"><button class="code-btn" data-act="codenav" data-d="-1">← Prev</button><button class="code-btn" data-act="codemap">Map</button><button class="code-btn" data-act="codenav" data-d="1">Next →</button></div></div><div class="code-codewrap" id="codewrap"><pre id="codepre" aria-label="Read-only program code"></pre></div></section></div>`;
  m.classList.add('on');const input=document.getElementById('codejump');input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jumpCodeViewer(input.value);}});
  paintCodeViewer(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches));setTimeout(()=>input.focus(),30);
}
function closeCodeViewer(){clearInterval(CODE_TIMER);CODE_TIMER=null;const m=document.getElementById('codem');if(m)m.classList.remove('on');}

/* ---------- revisions ---------- */
function openRevisions(){const b=document.getElementById('docbox');b.classList.add('revisions-full');b.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">Revisions</h2><button class="btn" data-act="docclose">✕ Close</button></div><div class="doc"><h3>v1.2 — 2026-11-20</h3><p>Entering available power with a selected pump now explicitly fills the missing duty pressure using pump power at the default PRV lift (duty + 15 psi, or +30 psi with EFPs). Added a dedicated <b>No PRV</b> checkbox beside the PRV lift field. No-PRV calculations use duty-point power and are restricted to <b>Non-Listed</b>: checking No PRV automatically returns UL or UL &amp; FM selections to Non-Listed with a warning, and listed approvals cannot be selected until No PRV is unchecked. Migrates v1.1 calculation files that used the old No PRV size option. Rechecked Windows-style desktop behavior in Microsoft Edge and Chromium, including keyboard input, file-download fallback and responsive layout.</p><h3>v1.1 — 2026-11-20</h3><p>Entry fields have their proper dark styling again (entered values were nearly invisible on a white background). Auto-filled values that are not yet confirmed are <b>orange</b>; values you entered, confirmed or locked are <b>green</b>. New <b>↺ Reset</b> button in the top bar clears every entry. Removed settings backup/restore from the File menu. Prepared for web hosting (GitHub Pages): built-in icon, page description, no external requests, and saving/opening files through the browser’s file picker where available.</p><h3>v1.0 — 2026-11-19</h3><p>First release of the stand-alone <b>Fire Lion Global Curve Calculator</b>. Any two of pump model, duty point pressure and desired flow (or pump model or duty pressure plus an available power) define the pump, PRV and required power; auto-filled values are orange until confirmed, every value can be typed over, and Lock keeps a value from being replaced — a locked desired flow is a minimum that re-selects the pump, and locked values that can no longer be met are reported in red. PRV lift defaults to duty + 15 psi (+30 psi with EFPs) and the PRV is sized at its set pressure. Includes the foam solution/concentrate and pricing-margin helpers, the curve and PRV source tables, undo/redo, autosave recovery, calculation and settings files, Imperial/Metric defaults, themes, and the protected Advanced menu (developer update flags, View Code, Revisions).</p></div>`;document.getElementById('docm').classList.add('on');}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  if(!(e.target.closest&&e.target.closest('#fmenu')))closeFileMenu();
  const g=e.target.closest&&e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return;}
  const a=e.target.closest&&e.target.closest('[data-act]');if(!a){if(!e.target.closest('#fmenu'))closeFileMenu();return;}
  const act=a.dataset.act;
  switch(act){
    case 'filemenu':e.stopPropagation();document.getElementById('fmenu').classList.toggle('open');return;
    case 'newcalc':closeFileMenu();newCalculation();break;
    case 'open':closeFileMenu();openCalculation();break;
    case 'save':closeFileMenu();saveCalculation(false);break;
    case 'saveas':closeFileMenu();saveCalculation(true);break;
    case 'recover':closeFileMenu();recoverSession();break;
    case 'example':closeFileMenu();loadExample();break;
    case 'resetall':resetAll();break;
    case 'undo':undo();break;
    case 'redo':redo();break;
    case 'themecycle':cycleTheme();break;
    case 'appfs':toggleAppFullscreen();break;
    case 'settingsexit':go(SETTINGS_RETURN||'curve');break;
    case 'units':{const u=a.dataset.u==='metric'?'metric':'imperial',prev=P.settings.units;if(u!==prev){P.settings.units=u;convertCurveUnits(P.curve,prev,u);save();render(true);toast(u==='metric'?'Metric units applied.':'Imperial units applied.');}break;}
    case 'advunlock':requestPassword('Unlock Advanced settings').then(ok=>{if(ok){ADV_UNLOCKED=true;render(true);}});break;
    case 'advlock':ADV_UNLOCKED=false;render(true);break;
    case 'viewcode':openCodeViewer();break;
    case 'codeanim':{const m=document.getElementById('codem');if(m)paintCodeViewer(m.classList.contains('noanim'));break;}
    case 'codetour':showCodeTour(+a.dataset.i);break;
    case 'codenav':codeNav(+a.dataset.d);break;
    case 'codemap':showCodeMap();break;
    case 'codeclose':closeCodeViewer();break;
    case 'revisions':openRevisions();break;
    case 'docclose':document.getElementById('docm').classList.remove('on');break;
    case 'devflagadd':{const d=P.developerUpdateFlags=normalizeDeveloperUpdateFlags(P.developerUpdateFlags);d.scoped.push({scope:'Overall app',note:''});save();render(true);setTimeout(()=>{const n=document.querySelector(`[data-devnote="${d.scoped.length-1}"]`);if(n)n.focus();},20);break;}
    case 'devflagremove':{const d=P.developerUpdateFlags=normalizeDeveloperUpdateFlags(P.developerUpdateFlags);d.scoped.splice(+a.dataset.i,1);save();render(true);break;}
  }
});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.devgeneral!==undefined){P.developerUpdateFlags=normalizeDeveloperUpdateFlags(P.developerUpdateFlags);P.developerUpdateFlags.general=t.value.slice(0,240);const c=document.querySelector('[data-devcount="general"]');if(c)c.textContent=P.developerUpdateFlags.general.length+'/240';save();return;}
  if(t.dataset.devnote!==undefined){P.developerUpdateFlags=normalizeDeveloperUpdateFlags(P.developerUpdateFlags);const i=+t.dataset.devnote;if(P.developerUpdateFlags.scoped[i])P.developerUpdateFlags.scoped[i].note=t.value.slice(0,240);const c=document.querySelector(`[data-devcount="${i}"]`);if(c)c.textContent=(P.developerUpdateFlags.scoped[i]?P.developerUpdateFlags.scoped[i].note.length:0)+'/240';save();return;}
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.devscope!==undefined){P.developerUpdateFlags=normalizeDeveloperUpdateFlags(P.developerUpdateFlags);const i=+t.dataset.devscope;if(P.developerUpdateFlags.scoped[i])P.developerUpdateFlags.scoped[i].scope=t.value;save();return;}
  if(t.dataset.set){P.settings[t.dataset.set]=t.checked;save();render(true);return;}
});
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){if(document.getElementById('codem')&&document.getElementById('codem').classList.contains('on')){closeCodeViewer();return;}if(document.getElementById('docm').classList.contains('on')){document.getElementById('docm').classList.remove('on');return;}if(document.getElementById('fmenu').classList.contains('open')){closeFileMenu();return;}if(cur==='settings'){go(SETTINGS_RETURN||'curve');return;}return;}
  if(!mod||e.altKey)return;
  if(k==='s'){e.preventDefault();saveCalculation(e.shiftKey);return;}
  if(k==='o'){e.preventDefault();openCalculation();return;}
  if((k==='z'||k==='y')&&!(e.target&&e.target.id==='codejump')){e.preventDefault();if(k==='y'||e.shiftKey)redo();else undo();}
});

/* ---------- startup ---------- */
function playStartupCodeAnimation(){return new Promise(resolve=>{let seen=false;try{seen=sessionStorage.getItem('flg_curve_intro_v1')==='1';if(!seen)sessionStorage.setItem('flg_curve_intro_v1','1');}catch(e){}if(seen){resolve();return;}const el=document.getElementById('startupCode'),pre=document.getElementById('startupCodeText');if(!el||!pre){resolve();return;}const safe=`// ${APP_NAME} v${APP_RELEASE} — LIVE PROGRAM MAP (READ ONLY)
const APP_STATE = newProject;
const CURVE_STATE = newCurve;
const SOLVER = c9Run;
const CURVE_POINT = curveAt;
const PRV_CAPACITY = prvCapacityAt;
const SCREEN_RENDERER = renderCurve;
const SESSION_SAVE = save;
CURVE_STATE -> SOLVER -> CURVE_POINT -> PRV_CAPACITY -> SCREEN_RENDERER
// protected credentials are intentionally excluded from this display`;el.classList.add('on');el.setAttribute('aria-hidden','false');pre.textContent='';let i=0;const tick=setInterval(()=>{i=Math.min(safe.length,i+Math.max(8,Math.ceil(safe.length/30)));pre.textContent=safe.slice(0,i);},20);setTimeout(()=>{clearInterval(tick);pre.textContent=safe;el.classList.remove('on');el.setAttribute('aria-hidden','true');resolve();},1050);});}
(async function init(){
  const ld=document.getElementById('loadmsg');if(ld)ld.parentNode.removeChild(ld);
  applyTheme(getTheme());updateFsButton();
  const ls=loadLocalSettings();if(ls){P.settings=ls;if(ls.units==='metric')P.curve=newCurve('metric');}
  const intro=playStartupCodeAnimation();
  render();histReset();
  DB.open().then(()=>DB.get('autosave')).then(a=>{lastAuto=a;});
  await intro;
})();
</script>
</body></html>
